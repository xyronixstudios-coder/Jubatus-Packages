[package]
name = "jubatus-forge"
version = "0.5.0"
edition = "2021"
description = "Jubatus Forge - .jps paket formatı ve yöneticisi"
license = "MIT"

[[bin]]
name = "jps"
path = "src/main.rs"

[dependencies]
zstd = "0.13"
ed25519-dalek = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
sha2 = "0.10"
tar = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
