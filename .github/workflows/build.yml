name: build-repo
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-repo
  cancel-in-progress: true
jobs:
  jps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            out: jps-64
          - target: i686-unknown-linux-musl
            out: jps-32
    steps:
      - uses: actions/checkout@v4
      - name: Araçlar
        run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-multilib
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Derle
        working-directory: forge
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Çıktıyı hazırla
        run: cp forge/target/${{ matrix.target }}/release/jps ${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
  packages:
    needs: jps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: İmza anahtarı
        env:
          JPS_SIGNING_KEY: ${{ secrets.JPS_SIGNING_KEY }}
        run: |
          test -n "$JPS_SIGNING_KEY" || { echo "JPS_SIGNING_KEY secret tanımlı değil"; exit 1; }
          mkdir -p ~/.config/jps
          (umask 077; printf '%s' "$JPS_SIGNING_KEY" > ~/.config/jps/signing.key)
      - name: Paketleri üret
        run: |
          chmod +x bin/jps-64 bin/jps-32
          REQUIRE_SIGN=1 JPS=bin/jps-64 scripts/build-all.sh dist
      - name: Depoyu yayınla (repo dalı)
        run: |
          cp bin/jps-64 bin/jps-32 install.sh dist/
          (cd dist && sha256sum jps-64 jps-32 > sha256sums)
          cd dist
          git init -q -b repo
          git config user.name "jubatus-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "repo: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo:repo
