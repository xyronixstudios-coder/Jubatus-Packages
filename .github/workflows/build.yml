name: build-repo
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-repo
  cancel-in-progress: true
jobs:
  jps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            out: jps-64
          - target: i686-unknown-linux-musl
            out: jps-32
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Derle (cross, statik musl)
        working-directory: forge
        run: |
          cross build --release --locked --target ${{ matrix.target }} || {
            echo "::warning::yerleşik indirici derlenemedi; curl/wget'e bağımlı sürüm derleniyor"
            cross build --release --locked --no-default-features --target ${{ matrix.target }}
          }
      - name: Çıktıyı hazırla
        run: cp forge/target/${{ matrix.target }}/release/jps ${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: i386
            platform: linux/386
    steps:
      - uses: actions/checkout@v4
      - name: Alpine içinde derle (statik musl)
        run: |
          mkdir -p trees
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            -e FORGE_ARCH=${{ matrix.arch }} -e FORGE_STRICT=1 -e HOST_UID="$(id -u)" \
            alpine:3.21 sh scripts/forge/ci-entry.sh /src/trees/${{ matrix.arch }}
      - name: Arşivle
        run: tar --numeric-owner -czf trees-${{ matrix.arch }}.tgz -C trees ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: trees-${{ matrix.arch }}
          path: trees-${{ matrix.arch }}.tgz
          compression-level: 0
  packages:
    needs: [jps, forge]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: İmza anahtarı
        env:
          JPS_SIGNING_KEY: ${{ secrets.JPS_SIGNING_KEY }}
        run: |
          test -n "$JPS_SIGNING_KEY" || { echo "JPS_SIGNING_KEY secret tanımlı değil"; exit 1; }
          mkdir -p ~/.config/jps
          (umask 077; printf '%s' "$JPS_SIGNING_KEY" > ~/.config/jps/signing.key)
      - name: Paket ağaçlarını aç
        run: |
          mkdir -p trees
          for a in amd64 i386; do tar -xzf bin/trees-$a.tgz -C trees; done
      - name: .jps paketlerini üret
        run: |
          chmod +x bin/jps-64 bin/jps-32
          REQUIRE_SIGN=1 JPS_ZSTD_LEVEL=15 JPS=bin/jps-64 BIN64=bin/jps-64 BIN32=bin/jps-32 \
            scripts/build-all.sh dist trees
      - name: İkilileri ve dizini imzala
        run: |
          bin/jps-64 sign-file bin/jps-64
          bin/jps-64 sign-file bin/jps-32
          bin/jps-64 sign-file dist/index
      - name: İmzaları openssl ile çapraz doğrula
        run: |
          python3 - "$(cat signing.pub)" > pub.pem <<'PY'
          import base64, sys
          raw = bytes.fromhex(sys.argv[1].strip())
          print("-----BEGIN PUBLIC KEY-----")
          print(base64.b64encode(bytes.fromhex("302a300506032b6570032100") + raw).decode())
          print("-----END PUBLIC KEY-----")
          PY
          for f in bin/jps-64 bin/jps-32 dist/index; do
            openssl pkeyutl -verify -pubin -inkey pub.pem -rawin -in "$f" -sigfile "$f.sig"
          done
      - name: Depoyu yayınla (repo dalı)
        run: |
          cp bin/jps-64 bin/jps-32 bin/jps-64.sig bin/jps-32.sig install.sh dist/
          for a in amd64 i386; do
            cp trees/$a/skipped.txt dist/skipped-$a.txt 2>/dev/null || true
          done
          (cd dist && sha256sum jps-64 jps-32 > sha256sums)
          cd dist
          git init -q -b repo
          git config user.name "jubatus-bot"
          git config user.email "bot@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add -A
          git commit -q -m "repo: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo:repo
      - name: Sayı denetimi
        run: |
          cat dist/STATS.txt
          . dist/STATS.txt
          if [ "$amd64" -lt 30 ] || [ "$i386" -lt 15 ]; then
            echo "Çok az paket (amd64>=30, i386>=15 bekleniyor): repo dalındaki skipped-amd64.txt / skipped-i386.txt dosyalarına bak"
            exit 1
          fi
