name: build-repo
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-repo
  cancel-in-progress: true
jobs:
  jps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            out: jps-64
          - target: i686-unknown-linux-musl
            out: jps-32
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Derle (cross, statik musl)
        working-directory: forge
        run: |
          cross build --release --locked --target ${{ matrix.target }} || {
            echo "::warning::yerleşik indirici derlenemedi; curl/wget'e bağımlı sürüm derleniyor"
            cross build --release --locked --no-default-features --target ${{ matrix.target }}
          }
      - name: Çıktıyı hazırla
        run: cp forge/target/${{ matrix.target }}/release/jps ${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            require: "jq ripgrep fzf"
          - arch: i386
            platform: linux/386
            require: "jq"
    steps:
      - uses: actions/checkout@v4
      - name: Hızlı deneme derlemesi (Alpine, statik musl) ve çalıştırma denemesi
        run: |
          mkdir -p trees
          PH="c gnu rust go"; if [ "${{ matrix.arch }}" = i386 ]; then PH="c gnu"; fi
          docker run --rm --dns 8.8.8.8 --dns 1.1.1.1 --platform ${{ matrix.platform }} -v "$PWD:/src" -w /src \
            -e FORGE_ARCH=${{ matrix.arch }} -e FORGE_STRICT=1 -e FORGE_PHASES="$PH" -e FORGE_ONLY="zlib ncurses jq hello ripgrep fzf" \
            -e HOST_UID="$(id -u)" alpine:3.21 sh scripts/forge/ci-entry.sh /src/trees/smoke
          echo "--- başarılı:"; cat trees/smoke/top.list
          echo "--- atlanan:"; cat trees/smoke/skipped.txt
          FAIL=""
          for r in ${{ matrix.require }}; do
            if ! grep -qxF "$r" trees/smoke/top.list; then
              echo "::error::smoke: '$r' derlenemedi"
              tail -n 40 "trees/smoke/_logs/$r.log" || true
              FAIL=1
            fi
          done
          for r in ${{ matrix.require }} hello; do
            b=$(find "trees/smoke/$r/root/usr/local/bin" -type f 2>/dev/null | head -n1 || true)
            [ -n "$b" ] || continue
            if [ "${{ matrix.arch }}" = i386 ]; then echo "  (i386 ikilisi çalıştırılmadı: $r)"; continue; fi
            if "$b" --version >/dev/null 2>&1; then
              echo "✔ başka dağıtımda (Ubuntu) çalışıyor: $r"
            else
              echo "::error::smoke: $r çalıştırılamadı"; FAIL=1
            fi
          done
          test -z "$FAIL"
  forge:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: i386
            platform: linux/386
    steps:
      - uses: actions/checkout@v4
      - name: Alpine içinde derle (statik musl)
        run: |
          mkdir -p trees
          PH="c gnu rust go"; BUD=300
          if [ "${{ matrix.arch }}" = i386 ]; then PH="c gnu"; BUD=120; fi
          docker run --rm --dns 8.8.8.8 --dns 1.1.1.1 --platform ${{ matrix.platform }} -v "$PWD:/src" -w /src \
            -e FORGE_ARCH=${{ matrix.arch }} -e FORGE_STRICT=1 -e FORGE_PHASES="$PH" \
            -e FORGE_SHARDS=8 -e FORGE_SHARD=${{ matrix.shard }} -e FORGE_BUDGET_MIN=$BUD \
            -e HOST_UID="$(id -u)" \
            alpine:3.21 sh scripts/forge/ci-entry.sh /src/trees/${{ matrix.arch }}-s${{ matrix.shard }}
      - name: Arşivle
        run: tar --numeric-owner -czf trees-${{ matrix.arch }}-s${{ matrix.shard }}.tgz -C trees ${{ matrix.arch }}-s${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: trees-${{ matrix.arch }}-s${{ matrix.shard }}
          path: trees-${{ matrix.arch }}-s${{ matrix.shard }}.tgz
          compression-level: 0
  forge-i386x:
    needs: smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Rust ve Go (i386 çapraz derleme)
        run: |
          mkdir -p trees
          FORGE_ARCH=i386 FORGE_STRICT=1 FORGE_PHASES="rust go" \
            FORGE_RUST_MODE=cross FORGE_RUST_TARGET=i686-unknown-linux-musl FORGE_GOARCH=386 \
            FORGE_SHARDS=8 FORGE_SHARD=${{ matrix.shard }} FORGE_BUDGET_MIN=300 \
            FORGE_WORK="$RUNNER_TEMP/forge-work" FORGE_DL="$RUNNER_TEMP/forge-dl" FORGE_SYSROOT="$RUNNER_TEMP/forge-sysroot" \
            bash scripts/forge/build-all.sh trees/i386x-s${{ matrix.shard }}
      - name: Arşivle
        run: tar --numeric-owner -czf trees-i386x-s${{ matrix.shard }}.tgz -C trees i386x-s${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: trees-i386x-s${{ matrix.shard }}
          path: trees-i386x-s${{ matrix.shard }}.tgz
          compression-level: 0
  forge-data:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Yazı tipleri ve eklentiler (mimariden bağımsız)
        run: |
          mkdir -p trees
          FORGE_ARCH=all FORGE_PHASES="fonts snap" \
            FORGE_WORK="$RUNNER_TEMP/forge-work" FORGE_DL="$RUNNER_TEMP/forge-dl" FORGE_SYSROOT="$RUNNER_TEMP/forge-sysroot" \
            bash scripts/forge/build-all.sh trees/all-s0
      - name: Arşivle
        run: tar --numeric-owner -czf trees-all-s0.tgz -C trees all-s0
      - uses: actions/upload-artifact@v4
        with:
          name: trees-all-s0
          path: trees-all-s0.tgz
          compression-level: 0
  packages:
    needs: [jps, forge, forge-i386x, forge-data]
    if: ${{ !cancelled() && needs.jps.result == 'success' && needs.forge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: İmza anahtarı
        env:
          JPS_SIGNING_KEY: ${{ secrets.JPS_SIGNING_KEY }}
        run: |
          test -n "$JPS_SIGNING_KEY" || { echo "JPS_SIGNING_KEY secret tanımlı değil"; exit 1; }
          mkdir -p ~/.config/jps
          (umask 077; printf '%s' "$JPS_SIGNING_KEY" > ~/.config/jps/signing.key)
      - name: Paket ağaçlarını aç
        run: |
          mkdir -p trees
          for f in bin/trees-*.tgz; do tar -xzf "$f" -C trees; done
          ls trees
      - name: .jps paketlerini üret
        run: |
          chmod +x bin/jps-64 bin/jps-32
          MAXTOTAL_MB=9000 REQUIRE_SIGN=1 JPS_ZSTD_LEVEL=15 JPS=bin/jps-64 BIN64=bin/jps-64 BIN32=bin/jps-32 \
            scripts/build-all.sh dist trees
      - name: İndeksi Release adreslerine çevir
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download"
          awk -F'\t' -v OFS='\t' -v b="$BASE" -v t64="pool-amd64-${{ github.run_id }}" -v t32="pool-i386-${{ github.run_id }}" \
            '{ tag = ($3=="i386") ? t32 : t64; sub(/^pool\//, "", $6); $6 = b "/" tag "/" $6; print }' \
            dist/index > dist/index.tmp
          mv dist/index.tmp dist/index
          head -n 2 dist/index
      - name: İkilileri ve dizini imzala
        run: |
          bin/jps-64 sign-file bin/jps-64
          bin/jps-64 sign-file bin/jps-32
          bin/jps-64 sign-file dist/index
      - name: İmzaları openssl ile çapraz doğrula
        run: |
          python3 - "$(cat signing.pub)" > pub.pem <<'PY'
          import base64, sys
          raw = bytes.fromhex(sys.argv[1].strip())
          print("-----BEGIN PUBLIC KEY-----")
          print(base64.b64encode(bytes.fromhex("302a300506032b6570032100") + raw).decode())
          print("-----END PUBLIC KEY-----")
          PY
          for f in bin/jps-64 bin/jps-32 dist/index; do
            openssl pkeyutl -verify -pubin -inkey pub.pem -rawin -in "$f" -sigfile "$f.sig"
          done
      - name: Paketleri Release'e yükle
        run: |
          REPO=${{ github.repository }}; RUN=${{ github.run_id }}
          gh release create "pool-amd64-$RUN" --repo "$REPO" --title "pool amd64 ($RUN)" --notes "otomatik üretim" \
            dist/pool/*_amd64.jps dist/pool/*_all.jps
          gh release create "pool-i386-$RUN" --repo "$REPO" --title "pool i386 ($RUN)" --notes "otomatik üretim" \
            dist/pool/*_i386.jps
      - name: Depoyu yayınla (repo dalı)
        run: |
          cp bin/jps-64 bin/jps-32 bin/jps-64.sig bin/jps-32.sig install.sh dist/
          cat trees/amd64-s*/skipped.txt > dist/skipped-amd64.txt 2>/dev/null || true
          cat trees/i386-s*/skipped.txt trees/i386x-s*/skipped.txt > dist/skipped-i386.txt 2>/dev/null || true
          cat trees/all-s*/skipped.txt > dist/skipped-all.txt 2>/dev/null || true
          rm -rf dist/pool
          (cd dist && sha256sum jps-64 jps-32 > sha256sums)
          cd dist
          git init -q -b repo
          git config user.name "jubatus-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "repo: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo:repo
      - name: Eski paket Release'lerini temizle
        run: |
          REPO=${{ github.repository }}; RUN=${{ github.run_id }}
          for t in $(gh release list --repo "$REPO" --limit 200 --json tagName -q '.[].tagName' | grep '^pool-' | grep -v -- "-$RUN\$" || true); do
            gh release delete "$t" --repo "$REPO" --cleanup-tag --yes || true
          done
      - name: Sayı raporu
        run: |
          cat dist/STATS.txt
          . dist/STATS.txt
          [ "$amd64" -ge 330 ] || echo "::warning::amd64: $amd64 paket (hedef 330)"
          [ "$i386" -ge 330 ] || echo "::warning::i386: $i386 paket (hedef 330)"
